name: build-deploy-to-server

on:
  push:
    branches:
      - main

# Only one deploy at a time (the 1 GB server can't build twice at once).
concurrency: deploy

jobs:
  build-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: "Install dependencies"
        run: npm ci

      - name: "Generate Prisma client"
        # generate doesn't connect to a database, but prisma.config.ts expects the variable.
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://build:build@localhost/build

      - name: "Build the project"
        run: npm run build

      - name: "Run tests"
        run: npm test

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: build-code # only deploy if the build and tests passed
    steps:
      - name: "Deploy over SSH"
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        # No `docker compose down`: `up --build` keeps the old version serving until the new one is ready.
        run: |
          echo "$SSH_KEY" > key && chmod 600 key
          ssh -i key -o StrictHostKeyChecking=accept-new "$SSH_TARGET" \
            'cd ~/docker-guard && git fetch && git checkout main && git pull && sudo docker compose up -d --build'
